name: Build & release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: build:mac
            artifact_name: macos-dmg
            artifact_glob: dist/*.dmg
          - os: windows-latest
            build_script: build:win
            artifact_name: windows-exe
            artifact_glob: dist/*.exe
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: linux-packages
            artifact_glob: |
              dist/*.deb
              dist/*.rpm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install pyinstaller

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-exe/*.exe
            artifacts/linux-packages/*.deb
            artifacts/linux-packages/*.rpm
          # Custom preamble + GitHub's auto-generated changelog appended below it.
          body: |
            ### Downloads

            | Platform | File | Install |
            |---|---|---|
            | macOS (Apple Silicon) | `*.dmg` | Open the DMG, drag into Applications |
            | Windows | `*.exe` | Run the installer |
            | Linux — Debian/Ubuntu | `*.deb` | `sudo apt install ./<file>.deb` |
            | Linux — Fedora/RHEL/openSUSE | `*.rpm` | `sudo rpm -U <file>.rpm` (or `sudo dnf install ./<file>.rpm`) |

            The `.deb`/`.rpm` packages are unsigned (RPM tools may warn about a missing GPG
            signature — expected). The in-app updater picks the format matching your distro.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
